name: chinook

services:
  db:
    image: mariadb:13-ubi
    restart: unless-stopped
    ports:
      - 3400:3306
    networks:
      - chinook-net
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d/
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 9000
    depends_on:
      - db
    networks:
      - chinook-net
    volumes:
      - ./web:/var/www/html
    environment:
      DB_HOST: ${DB_HOST}                               
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
  nginx:
    image: nginx:stable
    volumes:
      - ./web:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8100:80"                               
    depends_on:
      - php
    networks:
      - chinook-net

volumes:
  db-data:

networks:
  chinook-net: