name: chinook

services:
  db:
    image: mariadb:13-ubi
    restart: unless-stopped
    expose:
      - 3306
    networks:
      - chinook-net
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d/
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 9000
    depends_on:
      - db
    networks:
      - chinook-net
    volumes:
      - ./web:/var/www/html
    environment:
      DB_HOST: ${DB_HOST}                               
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
  nginx:
    image: nginx:stable
    volumes:
      - ./web:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8100:80"                               
    depends_on:
      - php
    networks:
      - chinook-net
  # heidisql:
  #   image: tsari/heidisql:latest
  #   container_name: heidisql
  #   restart: unless-stopped
  #   ports:
  #     - "3400:3400"
  #   networks:
  #     - chinook-net
  #   depends_on:
  #     - db
  #   volumes:
  #     - heidisql-data:/config
  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8200:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
    depends_on:
      - db
    networks:
      - chinook-net

volumes:
  db-data:
  heidisql-data:

networks:
  chinook-net: