name: chinook-roto

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - datos-roto:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3307"

  php:
    build: ./php
    ports:
      - 9000:9000
    environment:
      DB_HOST: db
      DB_NAME: Chinook_AutoIncrement
      DB_USER: api
      DB_PASS: api123
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:stable
    volumes:
      - ./web:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  datos-roto:
